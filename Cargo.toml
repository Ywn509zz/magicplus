[package]
name = "magicplus"
version = "0.8.0"
edition = "2021"
description = "MagicPlus : presse-papiers et transfert de fichiers chiffrés entre machines du réseau local."
build = "build.rs"

[lib]
name = "magicplus_core"
path = "src/lib.rs"

[[bin]]
name = "magicplus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.22"
crypto_box = "0.9"
dirs = "6"
global-hotkey = "0.7"
if-addrs = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
uuid = { version = "1", features = ["v4"] }
# Markdown des messages et des canevas (CommonMark + tableaux, cases à cocher…).
pulldown-cmark = { version = "0.13", default-features = false }
# Canevas partagés : édition à plusieurs en temps réel sans conflit (CRDT Yjs).
yrs = "0.28"
# Heure locale des messages (fuseau du système, sans Internet).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Interface Slint (Windows, Linux). Sur Mac, seulement avec `--features slint-on-mac` (essais).
slint = { version = "1", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
slint = "1"

# Interface AppKit native (macOS).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"

[features]
# Développement : lance l'interface Windows (Slint) sur un Mac pour la regarder ou la photographier.
slint-on-mac = ["dep:slint"]

[build-dependencies]
slint-build = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
